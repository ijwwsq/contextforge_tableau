[project]
name = "admin-console"
version = "0.1.0"
description = "Unified admin console with role-based access to the admin UIs."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37,<1.0",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admin_console"]

[project.scripts]
admin-console = "admin_console.console:main"

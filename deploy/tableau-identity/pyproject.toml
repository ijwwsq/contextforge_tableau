[project]
name = "tableau-identity"
version = "0.1.0"
description = "Per-user PAT auth broker and 1:1 mapping admin in front of tableau-mcp."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37,<1.0",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableau_identity"]

[project.scripts]
tableau-identity = "tableau_identity.broker:main"
tableau-identity-admin = "tableau_identity.admin:main"

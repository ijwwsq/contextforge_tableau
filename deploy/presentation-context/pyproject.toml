[project]
name = "presentation-context"
version = "0.1.0"
description = "MCP server that supplies presentation style guidelines."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.27.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "starlette>=0.37,<1.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_context"]

[project.scripts]
presentation-context = "presentation_context.server:main"
presentation-context-admin = "presentation_context.admin:main"

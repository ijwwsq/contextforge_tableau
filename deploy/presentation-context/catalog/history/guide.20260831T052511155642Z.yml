style_guide:
  organization_type: Квазигосударственная организация
  language: Русский, если заказчик не указал другой язык.
  voice:
  - 'Пиши как старший аналитик: деловой, спокойный, точный и без рекламных формулировок.'
  - Начинай с вывода и управленческого смысла, затем показывай доказательства и последствия.
  - 'Формулируй выводы проверяемо: факт, источник или допущение, влияние, рекомендуемое
    действие.'
  - Не выдумывай цифры, источники, нормативные акты, результаты или причинно-следственные
    связи. Неопределенность называй прямо.
  narrative:
  - Одна презентация отвечает на один управленческий вопрос; у каждого слайда один
    главный тезис.
  - 'Строй логику: контекст и задача, текущая ситуация, анализ причин, варианты, рекомендация,
    план и риски.'
  - Заголовок слайда должен быть выводом, а не названием темы.
  - Для решений указывай владельца, срок, ожидаемый эффект, зависимость и риск.
  slide_rules:
  - 'Не перегружай слайд: один ключевой график или схема и короткие подписи; подробности
    выноси в приложение.'
  - Таблицы используй только для сравнения. Выравнивай числа по разрядам, единицы
    измерения и период указывай явно.
  - На каждом графике показывай название показателя, период, единицу измерения, источник
    и существенные ограничения данных.
  - Не используй декоративные иллюстрации, стоковые фото, эмодзи, клипарт, 3D-эффекты,
    градиенты и анимацию ради украшения.
  - 'Логотипы и знаки не добавляй: утвержденный логотип пока не предоставлен.'
  typography:
  - Используй нейтральный гротеск Arial. Заголовки полужирные, основной текст обычный.
  - 'Соблюдай иерархию: крупный заголовок, компактный подзаголовок, читаемый основной
    текст, единый сеточный ритм.'
  - Не используй капслок для абзацев, чрезмерное выделение, декоративные шрифты и
    плотный текст.
  colors:
    primary_green: '#006B3F'
    dark_green: '#004C2D'
    gold_accent: '#C8A24A'
    charcoal_text: '#17211B'
    light_background: '#F5F7F5'
    rules:
    - Основной цвет интерфейса и ключевых серий данных - зеленый.
    - 'Золотой применяй точечно: акцент, целевой показатель или важное решение; не
      используй его как основной фон.'
    - Фон преимущественно светлый, текст темный; контраст должен оставаться читаемым
      при проецировании.
    - Для сравнительных данных используй нейтральные серые тона и один зеленый акцент;
      не кодируй смысл только цветом.
  quality_check:
  - Проверь, что заголовки передают выводы, числа согласованы, а вывод не сильнее
    доказательств.
  - 'Проверь читаемость с расстояния: достаточный размер текста, контраст, поля и
    отсутствие пересечений.'
  - Перед сдачей удали черновые пометки, неподтвержденные утверждения и визуальный
    шум.
